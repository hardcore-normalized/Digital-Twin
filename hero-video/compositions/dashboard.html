    // The dashboard arrives slightly large and settles.

    // Numbers count up from zero.
    const count = (sel, to, fmt, at, dur) => {
      const el = document.querySelector(sel);
      const o = { v: 0 };
      tl.to(o, { v: to, duration: dur, ease: "power2.out", onUpdate: () => (el.textContent = fmt(o.v)) }, at);

    tl.fromTo(".s2-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.55, ease: "power3.out", stagger: 0.03 }, 0.85);

    // The spike gets called out.
    tl.fromTo(
      "#s2-callout",
      { opacity: 0, x: -16, filter: "blur(6px)" },
      { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
